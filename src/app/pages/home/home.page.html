<ion-header [translucent]="true">
  <ion-button expand="block" (click)="counterup()" [disabled]="numero===MAXIMO"><ion-icon name="caret-up-outline" ></ion-icon></ion-button>

</ion-header >

<ion-content [fullscreen]="true">
 



  <div class="center-content big-font colorblack" >
    {{numero}}
  </div>



</ion-content>

<ion-footer>
  
<ion-button 
expand="block" 
(click)="counterdown()" 
[disabled]="numero===MINIMO" >
  <ion-icon name="caret-down-outline"></ion-icon>
</ion-button>
  
</ion-footer>
